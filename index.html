/* Layout: eine Aufgabenkarte im Mathefolien-Look (hellblau, Navy, rote Lösungen), Tastenfeld rechts bzw. unten */
:root{
  --bg:#dcefff; --card:#ffffff; --navy:#0d3b66; --navy-soft:#4a6a8a;
  --line:#b9d9f5; --blue:#2e86de; --red:#ef4444; --green:#16a34a; --yellow:#ffd23f;
  --ok-bg:#e3f8ea; --bad-bg:#fde8e8;
  --f-head:'Fredoka','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,sans-serif;
  --f-hand:'Patrick Hand','Comic Sans MS',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--f-body);font-size:18px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;background-color:var(--bg);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:flex;flex-direction:column;gap:16px}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Kopf: Pillen-Titel wie auf den Folien */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.pill{background:var(--card);border:4px solid var(--navy);border-radius:999px;padding:6px 26px;position:relative;box-shadow:6px 6px 0 var(--navy)}
.pill::after{content:"";position:absolute;inset:5px;border:2px dashed var(--line);border-radius:999px;pointer-events:none}
.pill h1{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(20px,3vw,28px);letter-spacing:.04em;text-transform:uppercase}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--navy);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;white-space:nowrap}
.chip.score{background:var(--yellow)}

/* Fortschritt */
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{background:var(--card);border:2px solid var(--navy);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.seg b{font-family:var(--f-head);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy);background:var(--card)}
.dot.ok{background:var(--green);border-color:var(--green)}
.dot.bad{background:var(--red);border-color:var(--red)}
.dot.now{background:var(--yellow)}

/* Karte */
.card{background:var(--card);border:3px solid var(--navy);border-radius:22px;padding:22px;box-shadow:0 6px 0 rgba(13,59,102,.18)}
.stage{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.stage.nokeys{grid-template-columns:1fr}
.task{display:flex;flex-direction:column;gap:18px;min-width:0}
.kicker{font-family:var(--f-head);font-weight:600;color:var(--blue);font-size:17px;letter-spacing:.03em}
.prompt{font-family:var(--f-head);font-weight:600;font-size:clamp(20px,2.6vw,26px);margin:0;text-wrap:balance}
.big{font-family:var(--f-head);font-weight:700;font-size:clamp(34px,6vw,58px);font-variant-numeric:tabular-nums;line-height:1.15;display:flex;flex-wrap:wrap;align-items:baseline;gap:.3em}
.big .approx{color:var(--red)}
.answer{min-width:3.5ch;border-bottom:5px solid var(--navy);padding:0 .15em;color:var(--blue)}
.answer.empty{color:var(--line)}
.answer.ok{color:var(--green);border-color:var(--green)}
.answer.bad{color:var(--red);border-color:var(--red);text-decoration:line-through}

/* Ziffern mit Tipp-Markierung */
.digit{display:inline-block;position:relative}
.digit.place{color:var(--blue);text-decoration:underline;text-decoration-thickness:5px;text-underline-offset:8px}
.digit.decide{color:var(--red)}
.digit.decide::after{content:"";position:absolute;inset:-2px -6px;border:3px solid var(--red);border-radius:50%}
.gap{display:inline-block;width:.28em}
.tipbox{background:#eaf5ff;border:2px dashed var(--blue);border-radius:14px;padding:10px 14px;font-size:17px;line-height:1.45}
.tipbox b{color:var(--blue)}
.tipbox .r{color:var(--red);font-weight:800}

/* Auswahlknöpfe */
.label{font-weight:800;font-size:16px;color:var(--navy-soft)}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.opt{background:var(--card);border:3px solid var(--navy);border-radius:16px;padding:12px 18px;font-weight:800;font-size:19px;min-height:56px;font-variant-numeric:tabular-nums;transition:transform .08s}
.opt:active{transform:scale(.96)}
.opt.sel{background:var(--navy);color:#fff}
.opt.right{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.opt.big2{font-size:24px;padding:14px 26px}

/* Tastenfeld */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{background:var(--card);border:3px solid var(--navy);border-radius:16px;height:66px;font-family:var(--f-head);font-weight:700;font-size:30px;box-shadow:0 4px 0 var(--navy)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.key.del{font-size:24px;background:#fff4d6}
.key.zero3{font-size:22px}

/* Aktionsleiste */
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:3px solid var(--navy);border-radius:999px;padding:12px 26px;font-weight:800;font-size:19px;background:var(--card);min-height:54px}
.btn.primary{background:var(--navy);color:#fff}
.btn.tip{background:#fff4d6}
.btn:disabled{opacity:.4;cursor:default}

.feedback{border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.5;font-weight:600}
.feedback.ok{background:var(--ok-bg);border:3px solid var(--green)}
.feedback.bad{background:var(--bad-bg);border:3px solid var(--red)}
.feedback b{font-weight:800}

/* Start / Ende */
.intro{display:flex;flex-direction:column;gap:18px}
.hand{font-family:var(--f-hand);color:var(--blue);font-size:34px;text-align:center;text-decoration:underline;text-underline-offset:6px;margin:0}
.rule{background:#eaf5ff;border:2px solid var(--blue);border-radius:16px;padding:14px 18px;font-size:18px;line-height:1.55}
.rule .ab{color:var(--blue);font-weight:800}.rule .auf{color:var(--red);font-weight:800}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.level{background:var(--card);border:3px solid var(--navy);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 var(--navy)}
.level:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.level .stars{font-size:26px;color:#f5a400;letter-spacing:2px}
.level h3{margin:0;font-family:var(--f-head);font-weight:700;font-size:23px}
.level p{margin:0;font-size:16px;line-height:1.4;color:var(--navy-soft)}
.parts{display:flex;gap:10px;flex-wrap:wrap;font-size:16px}
.parts span{background:#eaf5ff;border-radius:999px;padding:4px 12px;font-weight:700}
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .stars{font-size:56px;color:#f5a400;letter-spacing:6px}
.result .pts{font-family:var(--f-head);font-weight:700;font-size:44px}
.breakdown{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.breakdown div{background:#eaf5ff;border-radius:14px;padding:8px 16px;font-weight:700}

@media (max-width:820px){
  .stage{grid-template-columns:1fr}
  .levels{grid-template-columns:1fr}
  .key{height:58px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="pill"><h1>1.6 Zahlen runden</h1></div>
    <div class="meta" id="meta" hidden>
      <span class="chip" id="lvlChip"></span>
      <span class="chip score" id="scoreChip">0 Punkte</span>
    </div>
  </header>
  <div class="progress" id="progress" hidden></div>
  <main class="card" id="main"></main>
</div>

<script>
/* ---------- SCORM 1.2 (läuft nur in mebis, sonst still) ---------- */
const SCORM=(()=>{let api=null;
  function find(w){let n=0;while(w&&!w.API&&w.parent&&w.parent!==w&&n<10){w=w.parent;n++}return w&&w.API?w.API:null}
  try{api=find(window)||(window.opener&&find(window.opener))}catch(e){api=null}
  const call=(f,...a)=>{try{return api?api[f](...a):null}catch(e){return null}};
  call('LMSInitialize','');
  return{done(score,max){if(!api)return;call('LMSSetValue','cmi.core.score.min','0');call('LMSSetValue','cmi.core.score.max',String(max));
    call('LMSSetValue','cmi.core.score.raw',String(score));call('LMSSetValue','cmi.core.lesson_status',score/max>=0.5?'passed':'failed');call('LMSCommit','')},
    quit(){call('LMSFinish','')}};
})();
window.addEventListener('pagehide',()=>SCORM.quit());

/* ---------- Mathe-Helfer ---------- */
const PLACES={1:['Zehner','Z'],2:['Hunderter','H'],3:['Tausender','T'],4:['Zehntausender','ZT'],5:['Hunderttausender','HT'],6:['Millionen','Mio']};
const pow=p=>10**p;
const roundTo=(n,p)=>Math.round(n/pow(p))*pow(p);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>{const s=String(n);return s.length<4?s:s.replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
const digitAt=(n,i)=>Math.floor(n/pow(i))%10; // i=0 Einer
function makeNumber(len){let s=String(rnd(1,9));for(let i=1;i<len;i++)s+=rnd(0,9);return +s}
/* Zahl mit Übertrag: Rundungsstelle (und evtl. weitere) = 9, Entscheidungsziffer >=5 */
function makeCarry(len,p){let d=String(makeNumber(len)).split('').map(Number);const L=d.length;
  const idx=i=>L-1-i; d[idx(p-1)]=rnd(5,9); let k=p; const chain=rnd(1,3);
  for(let c=0;c<chain&&k<L;c++,k++){ d[idx(k)]=9 }
  if(d[0]===0)d[0]=9; return +d.join('')}
function stepRound(n,p){let x=n;for(let q=1;q<=p;q++)x=roundTo(x,q);return x}

/* ---------- Niveaus ---------- */
const LEVELS={
 1:{name:'Starter',stars:'★',text:'Zehner und Hunderter. Die wichtige Ziffer wird dir gezeigt.',
    A:{len:[3,4],places:[1,2]}, B:{len:[2,4],places:[1,2],carry:.15,tip:'always'}, C:{len:[3,4],places:[1,2]}},
 2:{name:'Profi',stars:'★★',text:'Bis zum Tausender, mit kniffligen 9ern. Tipp nur auf Knopfdruck.',
    A:{len:[4,5],places:[1,2,3]}, B:{len:[3,5],places:[1,2,3],carry:.35,tip:'button',edge:.12}, C:{len:[4,5],places:[2,3]}},
 3:{name:'Experte',stars:'★★★',text:'Große Zahlen bis zu den Millionen. Ohne Tipp.',
    A:{len:[5,7],places:[1,2,3,4,5]}, B:{len:[5,8],places:[3,4,5,6],carry:.4,tip:'none',edge:.12}, C:{len:[5,7],places:[3,4,5]}}
};

/* ---------- Aufgaben erzeugen ---------- */
function genA(cfg){ // wie Nr. 4: Auf welche Stelle? auf/ab?
  for(let t=0;t<500;t++){const len=rnd(...cfg.len);const n=makeNumber(len);const p=pick(cfg.places.filter(q=>q<len));if(p===undefined)continue;
    const r=roundTo(n,p);if(r===n)continue;
    if(cfg.places.some(q=>q!==p&&roundTo(n,q)===r))continue;
    return{type:'A',n,p,r,dir:r>n?'auf':'ab',places:cfg.places}}
}
function genB(cfg){ // wie Nr. 5: Runde auf …
  for(let t=0;t<500;t++){const len=rnd(...cfg.len);let p=pick(cfg.places);
    let n;
    if(cfg.edge&&Math.random()<cfg.edge&&p>=2){n=makeNumber(p);} // z.B. 49 auf Hunderter, 625 000 auf Millionen
    else{ if(p>=len)continue; n=Math.random()<cfg.carry?makeCarry(len,p):makeNumber(len)}
    const r=roundTo(n,p);if(r===n)continue;
    return{type:'B',n,p,r,tip:cfg.tip}}
}
function genC(cfg,wantTrue){ // wie Nr. 6: Fehler finden
  for(let t=0;t<800;t++){const len=rnd(...cfg.len);const p=pick(cfg.places.filter(q=>q<len));if(p===undefined)continue;
    let n=makeNumber(len);const kind=wantTrue?'ok':pick(['richtung','kette','stelle']);
    if(kind==='kette'){ if(p<2)continue; let d=String(n).split('').map(Number);const L=d.length;d[L-1-(p-1)]=4;d[L-1-(p-2)]=rnd(5,9);n=+d.join('')}
    const r=roundTo(n,p);if(r===n)continue;
    let shown=r,err='';
    if(kind==='richtung'){shown=r>n?r-pow(p):r+pow(p);err='Falsche Richtung: Hier hätte '+(r>n?'aufgerundet':'abgerundet')+' werden müssen.'}
    if(kind==='kette'){shown=stepRound(n,p);err='Schrittweise gerundet! Man schaut nur auf die eine Ziffer rechts neben der Rundungsstelle.'}
    if(kind==='stelle'){const q=pick([p-1,p+1].filter(x=>x>=1&&x<len));if(!q)continue;shown=roundTo(n,q);err='Auf die falsche Stelle gerundet ('+PLACES[q][0]+' statt '+PLACES[p][0]+').'}
    if(!wantTrue&&(shown===r||shown<0))continue;
    // Auswahl für die Korrektur
    let opts=new Set([r]); if(shown!==r)opts.add(shown);
    for(const c of [r+pow(p),r-pow(p),roundTo(n,p+1),r+2*pow(p)]){if(opts.size>=3)break;if(c>=0&&c!==n)opts.add(c)}
    return{type:'C',n,p,r,shown,isTrue:wantTrue,err,opts:shuffle([...opts])}}
}
function buildRound(level){const L=LEVELS[level];
  const A=[...Array(5)].map(()=>genA(L.A));
  const B=[...Array(5)].map(()=>genB(L.B));
  const truth=shuffle([true,true,false,false,false]);
  const C=truth.map(w=>genC(L.C,w));
  return[...A,...B,...C]}

/* ---------- Zustand ---------- */
let S={level:0,tasks:[],i:0,res:[],score:0};
const main=document.getElementById('main');
const $=s=>main.querySelector(s);

function digitsHTML(n,p,showTip){const s=String(n),L=s.length;let h='';
  for(let k=0;k<L;k++){const i=L-1-k;let cls='digit';
    if(showTip&&i===p)cls+=' place';if(showTip&&i===p-1)cls+=' decide';
    h+=`<span class="${cls}">${s[k]}</span>`;if(i>0&&i%3===0&&L>=4)h+='<span class="gap"></span>'}
  return h}
function tipHTML(t){const d=digitAt(t.n,t.p-1);const up=d>=5;
  return`<div class="tipbox">Rundungsstelle: <b>${PLACES[t.p][0]}</b>. Rechts daneben steht die <span class="r">${d}</span> → ${up?'<span class="r">aufrunden</span> (5, 6, 7, 8, 9)':'<b>abrunden</b> (0, 1, 2, 3, 4)'}.<br>Alle Ziffern rechts von der Rundungsstelle werden zu 0.</div>`}
function explain(t){const d=digitAt(t.n,t.p-1);
  return`Rundungsstelle ${PLACES[t.p][0]}, rechts daneben die ${d} → ${d>=5?'aufrunden':'abrunden'}: <b>${fmt(t.n)} ≈ ${fmt(t.r)}</b>`}

/* ---------- Bildschirme ---------- */
function renderStart(){
  document.getElementById('meta').hidden=true;document.getElementById('progress').hidden=true;
  main.innerHTML=`<div class="intro">
   <p class="hand">Zahlen runden – Wähle deine Stufe</p>
   <div class="rule">Bei <span class="ab">0, 1, 2, 3, 4</span> wird <span class="ab">abgerundet</span>, bei <span class="auf">5, 6, 7, 8, 9</span> wird <span class="auf">aufgerundet</span>.
   Entscheidend ist die Ziffer <b>rechts</b> neben der Rundungsstelle.</div>
   <div class="levels">${[1,2,3].map(l=>`<button class="level" data-l="${l}"><span class="stars">${LEVELS[l].stars}</span><h3>${LEVELS[l].name}</h3><p>${LEVELS[l].text}</p></button>`).join('')}</div>
   <div class="parts"><span>Teil A · Welche Stelle? (wie Nr. 4)</span><span>Teil B · Runde! (wie Nr. 5)</span><span>Teil C · Fehler finden (wie Nr. 6)</span></div>
  </div>`;
  main.querySelectorAll('.level').forEach(b=>b.onclick=()=>start(+b.dataset.l));
}
function start(l){S={level:l,tasks:buildRound(l),i:0,res:[],score:0};
  document.getElementById('meta').hidden=false;document.getElementById('progress').hidden=false;
  document.getElementById('lvlChip').textContent=LEVELS[l].stars+' '+LEVELS[l].name;render()}
function updateTop(){document.getElementById('scoreChip').textContent=S.score+(S.score===1?' Punkt':' Punkte');
  const names=['A · Stelle?','B · Runden','C · Fehler'];
  document.getElementById('progress').innerHTML=names.map((nm,g)=>`<div class="seg"><b>Teil ${nm}</b><div class="dots">${[0,1,2,3,4].map(k=>{const idx=g*5+k;const r=S.res[idx];
    return`<span class="dot ${r===true?'ok':r===false?'bad':idx===S.i?'now':''}"></span>`}).join('')}</div></div>`).join('')}
function render(){updateTop();if(S.i>=S.tasks.length)return renderEnd();const t=S.tasks[S.i];
  ({A:renderA,B:renderB,C:renderC})[t.type](t)}
function finish(ok,msg){S.res[S.i]=ok;if(ok)S.score++;updateTop();
  const fb=document.createElement('div');fb.className='feedback '+(ok?'ok':'bad');fb.innerHTML=(ok?'<b>Richtig!</b> ':'<b>Nicht ganz.</b> ')+msg;
  const act=$('.actions');act.innerHTML='';act.before(fb);
  const nx=document.createElement('button');nx.className='btn primary';nx.textContent=S.i===S.tasks.length-1?'Ergebnis ansehen':'Weiter →';
  nx.onclick=()=>{S.i++;render()};act.append(nx);nx.focus()}

/* Teil A */
function renderA(t){let place=null,dir=null;
  main.innerHTML=`<div class="stage nokeys"><div class="task">
   <span class="kicker">Teil A · Aufgabe ${S.i+1}</span>
   <p class="prompt">Auf welche Stelle wurde gerundet? Wurde auf- oder abgerundet?</p>
   <div class="big"><span>${fmt(t.n)}</span><span class="approx">≈</span><span>${fmt(t.r)}</span></div>
   <span class="label">Gerundet auf …</span>
   <div class="choices" id="cp">${t.places.map(p=>`<button class="opt" data-p="${p}">${PLACES[p][0]}</button>`).join('')}</div>
   <span class="label">Richtung</span>
   <div class="choices" id="cd"><button class="opt" data-d="ab">↓ abgerundet</button><button class="opt" data-d="auf">↑ aufgerundet</button></div>
   <div class="actions"><button class="btn primary" id="chk" disabled>Prüfen</button></div></div></div>`;
  const upd=()=>{$('#chk').disabled=!(place&&dir)};
  main.querySelectorAll('#cp .opt').forEach(b=>b.onclick=()=>{place=+b.dataset.p;main.querySelectorAll('#cp .opt').forEach(x=>x.classList.toggle('sel',x===b));upd()});
  main.querySelectorAll('#cd .opt').forEach(b=>b.onclick=()=>{dir=b.dataset.d;main.querySelectorAll('#cd .opt').forEach(x=>x.classList.toggle('sel',x===b));upd()});
  $('#chk').onclick=()=>{main.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.remove('sel');
      if(+b.dataset.p===t.p||b.dataset.d===t.dir)b.classList.add('right');else if(+b.dataset.p===place||b.dataset.d===dir)b.classList.add('wrong')});
    const ok=place===t.p&&dir===t.dir;const d=digitAt(t.n,t.p-1);
    $('.big span').innerHTML=digitsHTML(t.n,t.p,true);
    finish(ok,`Auf <b>${PLACES[t.p][0]}</b> gerundet. Rechts daneben steht die ${d} → <b>${t.dir==='auf'?'aufgerundet':'abgerundet'}</b>.`)};
}

/* Teil B */
function renderB(t){let val='';let tipOn=t.tip==='always';
  main.innerHTML=`<div class="stage"><div class="task">
   <span class="kicker">Teil B · Aufgabe ${S.i-4}</span>
   <p class="prompt">Runde auf <span style="color:var(--blue)">${PLACES[t.p][0]}</span>.</p>
   <div class="big"><span id="num">${digitsHTML(t.n,t.p,tipOn)}</span><span class="approx">≈</span><span class="answer empty" id="ans">?</span></div>
   <div id="tip">${tipOn?tipHTML(t):''}</div>
   <div class="actions">${t.tip==='button'?'<button class="btn tip" id="tipb">Tipp anzeigen</button>':''}<button class="btn primary" id="chk" disabled>Prüfen</button></div>
  </div>
  <div class="keys">${[7,8,9,4,5,6,1,2,3].map(k=>`<button class="key" data-k="${k}">${k}</button>`).join('')}
   <button class="key del" data-k="del" aria-label="Löschen">⌫</button><button class="key" data-k="0">0</button><button class="key zero3" data-k="000">000</button></div></div>`;
  const ans=$('#ans');
  const show=()=>{ans.textContent=val?fmt(+val):'?';ans.classList.toggle('empty',!val);$('#chk').disabled=!val};
  main.querySelectorAll('.key').forEach(b=>b.onclick=()=>{if(b.disabled)return;const k=b.dataset.k;
    if(k==='del')val=val.slice(0,-1);else if(val.length<10){val=(val+k).replace(/^0+(?=\d)/,'');}show()});
  const tb=$('#tipb');if(tb)tb.onclick=()=>{$('#num').innerHTML=digitsHTML(t.n,t.p,true);$('#tip').innerHTML=tipHTML(t);tb.remove()};
  $('#chk').onclick=()=>{main.querySelectorAll('.key').forEach(b=>b.disabled=true);
    const ok=+val===t.r;ans.classList.add(ok?'ok':'bad');$('#num').innerHTML=digitsHTML(t.n,t.p,true);
    if(!ok){const s=document.createElement('span');s.className='answer ok';s.textContent=fmt(t.r);ans.after(s)}
    finish(ok,explain(t))};
}

/* Teil C */
function renderC(t){
  main.innerHTML=`<div class="stage nokeys"><div class="task">
   <span class="kicker">Teil C · Aufgabe ${S.i-9}</span>
   <p class="prompt">Auf ${PLACES[t.p][0]} gerundet. Stimmt die Rundung?</p>
   <div class="big"><span id="num">${digitsHTML(t.n,t.p,false)}</span><span class="approx">≈</span><span>${fmt(t.shown)}</span></div>
   <div class="choices" id="tf"><button class="opt big2" data-v="1">✓ stimmt</button><button class="opt big2" data-v="0">✗ falsch</button></div>
   <div id="fix"></div>
   <div class="actions"></div></div></div>`;
  main.querySelectorAll('#tf .opt').forEach(b=>b.onclick=()=>{const said=b.dataset.v==='1';
    main.querySelectorAll('#tf .opt').forEach(x=>{x.disabled=true;if((x.dataset.v==='1')===t.isTrue)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    $('#num').innerHTML=digitsHTML(t.n,t.p,true);
    if(said!==t.isTrue){return finish(false,t.isTrue?'Die Rundung stimmt. '+explain(t):t.err+' '+explain(t))}
    if(t.isTrue)return finish(true,explain(t));
    // falsch erkannt → korrigieren
    $('#fix').innerHTML=`<span class="label">Gut erkannt! Wie heißt die richtige Rundung?</span><div class="choices" id="co">${t.opts.map(o=>`<button class="opt big2" data-o="${o}">${fmt(o)}</button>`).join('')}</div>`;
    main.querySelectorAll('#co .opt').forEach(c=>c.onclick=()=>{const ok=+c.dataset.o===t.r;
      main.querySelectorAll('#co .opt').forEach(x=>{x.disabled=true;if(+x.dataset.o===t.r)x.classList.add('right');else if(x===c)x.classList.add('wrong')});
      finish(ok,t.err+' '+explain(t))});
  });
}

/* Ergebnis */
function renderEnd(){const max=S.tasks.length,sc=S.score;SCORM.done(sc,max);
  const st=sc>=14?3:sc>=10?2:sc>=6?1:0;
  const part=g=>S.res.slice(g*5,g*5+5).filter(Boolean).length;
  const next=st>=3&&S.level<3?`<button class="btn" id="up">Nächste Stufe: ${LEVELS[S.level+1].stars} ${LEVELS[S.level+1].name}</button>`:'';
  const tip=st<2?'Schau dir den Hefteintrag noch einmal an und übe dann auf derselben Stufe.':st<3?'Schon gut! Noch eine Runde, dann klappt es sicher.':'Super! Du kannst Zahlen sicher runden.';
  main.innerHTML=`<div class="result">
   <p class="hand">Geschafft!</p>
   <div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
   <div class="pts">${sc} von ${max} Punkten</div>
   <div class="breakdown"><div>Teil A: ${part(0)}/5</div><div>Teil B: ${part(1)}/5</div><div>Teil C: ${part(2)}/5</div></div>
   <p style="font-size:19px;margin:0">${tip}</p>
   <div class="actions" style="justify-content:center"><button class="btn primary" id="again">Nochmal (neue Zahlen)</button>${next}<button class="btn" id="home">Stufe wählen</button></div></div>`;
  $('#again').onclick=()=>start(S.level);$('#home').onclick=renderStart;const u=$('#up');if(u)u.onclick=()=>start(S.level+1);
}
renderStart();
</script>

</body></html>
